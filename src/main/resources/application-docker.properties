
# Redis Core Connection
spring.data.redis.host=redis
spring.data.redis.port=6379


# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:4001
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
  
  # User Service Route
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=http://user-service:4002
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**
  
  # Transaction Service Route
spring.cloud.gateway.routes[2].id=transaction-service
spring.cloud.gateway.routes[2].uri=http://transaction-service:4003
spring.cloud.gateway.routes[2].predicates[0]=Path=/transactions/**
  
  # Ledger Service Route
spring.cloud.gateway.routes[3].id=ledger-service
spring.cloud.gateway.routes[3].uri=http://ledger-service:4004
spring.cloud.gateway.routes[3].predicates[0]=Path=/ledger/**