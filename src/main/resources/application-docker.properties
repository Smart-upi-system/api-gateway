# Use Docker DNS names while retaining predicates, filters and resilience settings
# from application.properties.
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:4001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=authCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:4002
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=userCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://transaction-service:4003
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transaction/**
spring.cloud.gateway.server.webflux.routes[2].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=transactionCircuitBreaker

spring.cloud.gateway.server.webflux.routes[7].id=transaction-write-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://transaction-service:4003
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/transaction/**
spring.cloud.gateway.server.webflux.routes[7].predicates[1]=Method=POST,PUT,PATCH,DELETE
spring.cloud.gateway.server.webflux.routes[7].filters[0]=CircuitBreaker=transactionCircuitBreaker
spring.cloud.gateway.server.webflux.routes[7].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[7].filters[1].args.rate-limiter=#{@transactionRateLimiter}
spring.cloud.gateway.server.webflux.routes[7].filters[1].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[3].id=ledger-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://ledger-service:4004
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ledger/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=CircuitBreaker=ledgerCircuitBreaker
spring.cloud.gateway.server.webflux.routes[4].id=wallet-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://wallet-service:4005
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/wallet/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=CircuitBreaker=walletCircuitBreaker
spring.cloud.gateway.server.webflux.routes[5].id=fraud-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://fraud-service:4006
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/fraud/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=CircuitBreaker=fraudCircuitBreaker
spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://notification-service:4007
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=CircuitBreaker=notificationCircuitBreaker
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:yourRedisPassword}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.hostname=api-gateway
eureka.instance.prefer-ip-address=true
