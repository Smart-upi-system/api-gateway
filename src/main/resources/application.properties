spring.application.name=api-gateway
server.port=4000

# Global Cors configuration
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:3000
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins[1]=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods[5]=PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=false
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].maxAge=3600
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true

# Auth Service Route
#spring.cloud.gateway.server.webflux.routes=auth-service
#spring.cloud.gateway.server.webflux.default-filters=http://localhost:4001
# Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://auth-service:4001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=authCircuitBreaker

# User Service Route
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://user-service:4002
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=userCircuitBreaker

# Transaction Service Route
spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://transaction-service:4003
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transaction/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=transactionCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[1].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.rate-limiter=#{@transactionRateLimiter}
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.key-resolver=#{@userKeyResolver}

# Ledger Service Route
spring.cloud.gateway.server.webflux.routes[3].id=ledger-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:4004
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ledger/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=CircuitBreaker=ledgerCircuitBreaker

# Wallet Service Route
spring.cloud.gateway.server.webflux.routes[4].id=wallet-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://wallet-service:4005
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/wallet/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=CircuitBreaker=walletCircuitBreaker

# Fraud Service Route
spring.cloud.gateway.server.webflux.routes[5].id=fraud-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://fraud-service:4006
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/fraud/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=CircuitBreaker=fraudCircuitBreaker

# Notification Service Route
spring.cloud.gateway.server.webflux.routes[6].id=notification-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://notification-service:4007
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=CircuitBreaker=notificationCircuitBreaker

# Service Registry
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port=${server.port}
#eureka.instance.secure-port-enabled=false
#eureka.instance.ip-address=127.0.0.1
eureka.instance.appname=${spring.application.name}


# Default Filters (Retry Logic)
spring.cloud.gateway.server.webflux.default-filters[0].name=Retry
spring.cloud.gateway.server.webflux.default-filters[0].args.retries=3
spring.cloud.gateway.server.webflux.default-filters[0].args.statuses=BAD_GATEWAY,GATEWAY_TIMEOUT
spring.cloud.gateway.server.webflux.default-filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[0].args.backoff.firstBackoff=50ms
spring.cloud.gateway.server.webflux.default-filters[0].args.backoff.maxBackoff=500ms

# HTTP Client Timeouts
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s

# Redis Connection Settings
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:yourRedisPassword}
spring.data.redis.timeout=2000ms

# Lettuce Connection Pool Settings
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0


# JWT Configuration
jwt.secret=BGiBX8GENIcKINk+z2A75yW5FeeGZWDNUdEODj0HHrE=
jwt.expiration=86400000


# Custom Rate Limiting Properties
rate-limit.default.capacity=100
rate-limit.default.refill-tokens=10
rate-limit.default.refill-duration=1s
rate-limit.transaction.capacity=10
rate-limit.transaction.refill-tokens=1
rate-limit.transaction.refill-duration=1s

# Resilience4j Circuit Breaker - Default Config
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.eventConsumerBufferSize=10
resilience4j.timelimiter.instances.userCircuitBreaker.timeoutDuration=10s
resilience4j.timelimiter.instances.authCircuitBreaker.timeoutDuration=10s
resilience4j.timelimiter.instances.transactionCircuitBreaker.timeoutDuration=10s
resilience4j.timelimiter.instances.ledgerCircuitBreaker.timeoutDuration=10s
resilience4j.timelimiter.instances.walletCircuitBreaker.timeoutDuration=10s
resilience4j.timelimiter.instances.fraudCircuitBreaker.timeoutDuration=10s
resilience4j.timelimiter.instances.notificationCircuitBreaker.timeoutDuration=10s

# Resilience4j Circuit Breaker - Instances
resilience4j.circuitbreaker.instances.authCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.userCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.transactionCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.ledgerCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.walletCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.fraudCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.baseConfig=default


# Actuator & Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.wallet.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n